name: Windows Quick Setup validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["quicksetup-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run PowerShell smoke tests
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests\quicksetup-smoke.ps1

      - name: Run package security regression fixtures (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests\installer-regressions.ps1

      - name: Run package security regression fixtures (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tests/installer-regressions.ps1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore GUI and controller tests
        shell: powershell
        run: dotnet restore windows\ConfigureMe.Setup.Tests\ConfigureMe.Setup.Tests.csproj

      - name: Run GUI controller and embedded-engine tests
        shell: powershell
        run: |
          $resultsPath = Join-Path $env:RUNNER_TEMP "configureMe-gui-test-results"
          dotnet test windows\ConfigureMe.Setup.Tests\ConfigureMe.Setup.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=gui-tests.trx" --results-directory $resultsPath
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $resultFile = Join-Path $resultsPath "gui-tests.trx"
            if (Test-Path -LiteralPath $resultFile) {
              [xml]$results = Get-Content -LiteralPath $resultFile -Raw
              foreach ($test in @($results.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" })) {
                $message = "$($test.testName): $($test.Output.ErrorInfo.Message)`n$($test.Output.ErrorInfo.StackTrace)"
                $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error title=Windows GUI test failure::$escaped"
              }
            }
            exit $testExit
          }

      - name: Retain failed GUI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/configureMe-gui-test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Run portable engine and aggregate-report tests
        shell: powershell
        run: dotnet test windows\ConfigureMe.Setup.Portable.Tests\ConfigureMe.Setup.Portable.Tests.csproj --configuration Release

      - name: Publish self-contained Windows x64 GUI
        shell: powershell
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP "configureMe Setup publish"
          # Child manifest generation must work despite an inherited restrictive
          # process policy; no machine/user policy is modified. Output path tests spaces.
          $previousPolicy = $env:PSExecutionPolicyPreference
          try {
            $env:PSExecutionPolicyPreference = "Restricted"
            dotnet publish windows\ConfigureMe.Setup\ConfigureMe.Setup.csproj --configuration Release -p:PublishProfile=win-x64 --output $publishPath
            if ($LASTEXITCODE -ne 0) { throw "Self-contained WinForms publish failed under restrictive process policy." }
          } finally { $env:PSExecutionPolicyPreference = $previousPolicy }
          $executable = Join-Path $publishPath "configureMe-Setup.exe"
          if (!(Test-Path -LiteralPath $executable -PathType Leaf)) { throw "The published setup EXE is missing." }
          if (Get-ChildItem -LiteralPath $publishPath -Filter "*.dll" -File) { throw "The self-contained single-file publish has external DLL dependencies." }
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $env:DOTNET_ROOT = Join-Path $env:RUNNER_TEMP "no-global-dotnet"
          $env:DOTNET_ROOT_X64 = $env:DOTNET_ROOT
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          & $executable --self-test
          if ($LASTEXITCODE -ne 0) { throw "The published EXE failed its embedded engine/worker startup self-test." }
          # Exercise ShellExecute/startup without a terminal or repository working directory.
          $startup = Start-Process -FilePath $executable -ArgumentList "--startup-layout-self-test" -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if ($startup.ExitCode -ne 0) { throw "The published EXE failed its shell-launched initial message-loop layout test." }
          & $executable --layout-self-test
          if ($LASTEXITCODE -ne 0) { throw "The published EXE failed its category/row layout self-test." }

      - name: Package unsigned setup development artifact
        shell: powershell
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP "configureMe Setup publish"
          $packagePath = Join-Path $env:RUNNER_TEMP "configureMe-Setup-win-x64.zip"
          powershell.exe -NoProfile -NonInteractive -File scripts\New-SetupReleasePackage.ps1 -PublishDirectory $publishPath -OutputPath $packagePath
          if ($LASTEXITCODE -ne 0) { throw "Setup package generation failed." }

      - name: Build release candidate ZIP
        shell: powershell
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "configureMe-WindowsServer2022-Developer-QuickSetup.zip"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\New-WindowsServer2022QuickSetup.ps1 -OutputPath $zipPath
          if ($LASTEXITCODE -ne 0) { throw "Quick Setup packaging failed." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $manifestEntry = $archive.GetEntry("configureMe-QuickSetup/manifest.json")
            if (!$manifestEntry) { throw "The ZIP has no package manifest." }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally {
            $archive.Dispose()
          }
          $head = (& git rev-parse --verify HEAD).Trim()
          if ($manifest.sourceCommitSha -ne $head -or $manifest.workingTreeDirty) { throw "The package provenance does not match the clean checked-out commit." }

      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-2022-quicksetup-${{ github.sha }}
          path: |
            ${{ runner.temp }}\configureMe-Setup-win-x64.zip
            ${{ runner.temp }}\configureMe-Setup-win-x64.zip.sha256
            ${{ runner.temp }}\configureMe-WindowsServer2022-Developer-QuickSetup.zip
            ${{ runner.temp }}\configureMe-WindowsServer2022-Developer-QuickSetup.zip.sha256
          if-no-files-found: error
          retention-days: 7
