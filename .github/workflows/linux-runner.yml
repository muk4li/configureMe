name: Linux runner validation
on:
  # No branch filter: stacked CM-042 pull requests target other feature branches.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-runner:
    # Same release as the target VM (Ubuntu 24.04, system Python 3.12). No installs, no root.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m unittest discover -s tests/linux -v
